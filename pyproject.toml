[project]
name = "pq-face-finder"
version = "0.1.0"
description = "Find which of your photos contain a given person, with face recognition that runs entirely on your computer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.2.2",
    "flask>=3.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.scripts]
facefinder = "facefinder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facefinder"]
